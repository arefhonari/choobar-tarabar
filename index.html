<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چوبر ترابر (نیسان)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e3e6ea;--pr:#2563eb;--prt:#fff;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mu:#9aa3ad;--bd:#2d3239;--pr:#60a5fa;--prt:#0b1220;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mu:#9aa3ad;--bd:#2d3239;--pr:#60a5fa;--prt:#0b1220;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Tahoma,"Segoe UI",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:12px 12px 80px}
h1{margin:4px 0 12px;display:flex;justify-content:center}h1 svg{width:150px;height:150px;flex:none}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:bold}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.route{font-weight:bold;font-size:17px}
.meta{color:var(--mu);font-size:14px;margin-top:4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:0;background:var(--pr);color:var(--prt);font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-inline-start:6px}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.empty,.note{color:var(--mu);text-align:center;padding:24px 8px}
.note{background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>
<h1 role="img" aria-label="چوبر ترابر (نیسان)"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><linearGradient id="lsd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b6c4d8"/></linearGradient><linearGradient id="lfr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbe4f0"/><stop offset="1" stop-color="#7f93b0"/></linearGradient><linearGradient id="lgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><radialGradient id="lrm" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#64748b"/></radialGradient><filter id="lbl"><feGaussianBlur stdDeviation="7"/></filter><filter id="lts"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1d4d" flood-opacity=".6"/></filter></defs><rect width="512" height="512" rx="112" fill="url(#lbg)"/><ellipse cx="190" cy="40" rx="230" ry="110" fill="#fff" opacity=".10"/><ellipse cx="262" cy="346" rx="205" ry="15" fill="#0b1d4d" opacity=".55" filter="url(#lbl)"/><g transform="translate(-17,10)"><polygon points="80,210 260,210 296,184 116,184" fill="#1e3a8a"/><polygon points="116,184 296,184 296,208 116,208" fill="#172c6b"/><polygon points="110,160 170,160 196,142 136,142" fill="#fcd34d"/><polygon points="170,160 196,142 196,212 170,230" fill="#d99a14"/><rect x="110" y="160" width="60" height="70" fill="#f59e0b"/><polygon points="190,172 236,172 262,154 216,154" fill="#fde68a"/><polygon points="236,172 262,154 262,214 236,232" fill="#c98a12"/><rect x="190" y="172" width="46" height="60" fill="#fbbf24"/><polygon points="395,215 430,222 466,196 431,189" fill="#f8fafc"/><polygon points="275,160 345,160 381,134 311,134" fill="#ffffff"/><polygon points="345,160 395,215 431,189 381,134" fill="url(#lgl)"/><polygon points="430,222 466,196 466,274 430,300" fill="url(#lfr)"/><polygon points="434,236 446,227 446,243 434,252" fill="#fde68a"/><polygon points="434,262 462,242 462,262 434,282" fill="#475569"/><polygon points="430,290 466,264 466,274 430,300" fill="#475569"/><path d="M80 210 H260 L275 160 H345 L395 215 H430 V300 H80 Z" fill="url(#lsd)"/><path d="M288 172 H335 L372 212 H288 Z" fill="url(#lgl)"/><line x1="80" y1="252" x2="430" y2="252" stroke="#94a3b8" stroke-width="2" opacity=".7"/><line x1="262" y1="212" x2="262" y2="300" stroke="#94a3b8" stroke-width="2" opacity=".7"/><rect x="296" y="228" width="26" height="6" rx="3" fill="#94a3b8"/><polygon points="80,210 260,210 260,216 80,216" fill="#fff" opacity=".7"/><circle cx="160" cy="300" r="42" fill="#1e3a8a"/><circle cx="160" cy="300" r="34" fill="#0f172a"/><circle cx="160" cy="300" r="20" fill="url(#lrm)"/><circle cx="160" cy="300" r="6" fill="#475569"/><circle cx="365" cy="300" r="42" fill="#1e3a8a"/><circle cx="365" cy="300" r="34" fill="#0f172a"/><circle cx="365" cy="300" r="20" fill="url(#lrm)"/><circle cx="365" cy="300" r="6" fill="#475569"/></g><g filter="url(#lts)" font-family="Tahoma,'Segoe UI',sans-serif" text-anchor="middle" fill="#fff"><text x="256" y="428" font-size="60" font-weight="bold">چوبر ترابر</text><text x="256" y="474" font-size="34" opacity=".92">(نیسان)</text></g></svg></h1>
<nav>
  <button data-t="list" class="on">آگهی‌ها</button>
  <button data-t="new">ثبت آگهی</button>
  <button data-t="mine">آگهی‌های من</button>
</nav>
<div id="note"></div>
<main id="view"></main>

<script>
(function(){
  var token=null, tab="list", cityFilter="", loads=[], phoneForCode="";
  try{token=localStorage.getItem("ct_token")}catch(e){}
  var view=document.getElementById("view"), note=document.getElementById("note"), nav=document.querySelector("nav");

  function el(tag,props,kids){
    var e=document.createElement(tag);
    for(var k in (props||{})){
      if(k==="text")e.textContent=props[k];
      else if(k==="class")e.className=props[k];
      else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),props[k]);
      else e.setAttribute(k,props[k]);
    }
    (kids||[]).forEach(function(c){if(c)e.appendChild(c)});
    return e;
  }
  function fmt(ts){try{return new Date(ts).toLocaleDateString("fa-IR")}catch(e){return ""}}
  function setNote(t){note.textContent="";if(t)note.appendChild(el("div",{class:"note",text:t}))}

  function api(path,opts){
    opts=opts||{};
    var h={"Content-Type":"application/json"};
    if(token)h.Authorization="Bearer "+token;
    return fetch("/api"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
      .then(function(r){
        return r.json().catch(function(){return {}}).then(function(j){
          if(r.status===401&&token){logout();throw new Error("auth")}
          if(!r.ok)throw new Error(j.error||"خطا در ارتباط");
          return j;
        });
      });
  }
  function logout(){
    token=null;try{localStorage.removeItem("ct_token")}catch(e){}
    start();
  }

  /* ---------- login ---------- */
  function renderLogin(step){
    nav.style.display="none";
    view.textContent="";
    var card=el("div",{class:"card"});
    var msg=el("div",{class:"meta"});
    if(step==="phone"){
      card.appendChild(el("div",{class:"route",text:"ورود با شماره موبایل"}));
      card.appendChild(el("label",{for:"lp",text:"شماره موبایل"}));
      card.appendChild(el("input",{id:"lp",type:"tel",inputmode:"numeric",placeholder:"09123456789"}));
      var b=el("button",{class:"btn",style:"width:100%;margin-top:14px",text:"ارسال کد تأیید"});
      b.addEventListener("click",function(){
        var p=document.getElementById("lp").value.trim();
        b.disabled=true;msg.textContent="در حال ارسال...";
        api("/auth/send",{method:"POST",body:{phone:p}}).then(function(){phoneForCode=p;renderLogin("code")})
          .catch(function(e){msg.textContent=e.message;b.disabled=false});
      });
      card.appendChild(b);
    }else{
      card.appendChild(el("div",{class:"route",text:"کد تأیید را وارد کنید"}));
      card.appendChild(el("div",{class:"meta",text:"کد به شماره‌ی "+phoneForCode+" پیامک شد."}));
      card.appendChild(el("input",{id:"lc",type:"tel",inputmode:"numeric",placeholder:"- - - - -",autocomplete:"one-time-code",style:"margin-top:10px"}));
      var b2=el("button",{class:"btn",style:"width:100%;margin-top:14px",text:"ورود"});
      b2.addEventListener("click",function(){
        b2.disabled=true;msg.textContent="در حال بررسی...";
        api("/auth/verify",{method:"POST",body:{phone:phoneForCode,code:document.getElementById("lc").value}})
          .then(function(j){token=j.token;try{localStorage.setItem("ct_token",token)}catch(e){}start()})
          .catch(function(e){msg.textContent=e.message;b2.disabled=false});
      });
      card.appendChild(b2);
      card.appendChild(el("button",{class:"btn sec",style:"width:100%;margin-top:8px",text:"تغییر شماره",onclick:function(){renderLogin("phone")}}));
    }
    card.appendChild(msg);
    view.appendChild(card);
  }

  /* ---------- cards ---------- */
  function loadCard(d,mine){
    var open=d.status==="open";
    var card=el("div",{class:"card"},[
      el("div",{class:"route",text:d.originCity+" ← "+d.destCity}),
      el("div",{class:"meta",text:(d.cargoType||"بار")+(d.weightKg?" · "+d.weightKg+" کیلو":"")}),
      d.when?el("div",{class:"meta",text:"زمان: "+d.when}):null,
      (d.originAddress||d.destAddress)?el("div",{class:"meta",text:[d.originAddress,d.destAddress].filter(Boolean).join(" ← ")}):null,
      el("div",{class:"meta"},[document.createTextNode("ثبت: "+fmt(d.createdAt)),
        el("span",{class:"tag"+(open?" ok":""),text:open?"باز":"بسته"})])
    ]);
    var row=el("div",{class:"row"});
    if(open&&!mine){
      row.appendChild(el("a",{class:"btn",href:"tel:"+d.phone,target:"_top",text:"📞 تماس "+d.phone}));
      row.appendChild(el("button",{class:"btn sec",text:"گزارش",onclick:function(e){
        e.target.disabled=true;api("/loads/"+d.id+"/report",{method:"POST"}).then(function(){e.target.textContent="گزارش شد"}).catch(function(){})}}));
    }
    if(mine&&open)row.appendChild(el("button",{class:"btn sec",text:"بستن آگهی",onclick:function(){
      api("/loads/"+d.id+"/close",{method:"POST"}).then(function(){setTab("mine")})}}));
    if(row.childNodes.length)card.appendChild(row);
    return card;
  }

  function renderList(){
    view.textContent="";
    var cities={};loads.forEach(function(d){cities[d.originCity]=1});
    view.appendChild(el("select",{onchange:function(e){cityFilter=e.target.value;renderList()}},
      [el("option",{value:"",text:"همه‌ی شهرها (مبدا)"})].concat(Object.keys(cities).map(function(c){
        var o=el("option",{value:c,text:c});if(c===cityFilter)o.selected=true;return o}))));
    var items=loads.filter(function(d){return !cityFilter||d.originCity===cityFilter});
    if(!items.length)view.appendChild(el("div",{class:"empty",text:"فعلا آگهی بازی نیست."}));
    items.forEach(function(d){view.appendChild(loadCard(d,false))});
  }
  function renderMine(){
    view.textContent="";
    if(!loads.length)view.appendChild(el("div",{class:"empty",text:"هنوز آگهی ثبت نکرده‌اید."}));
    loads.forEach(function(d){view.appendChild(loadCard(d,true))});
    view.appendChild(el("button",{class:"btn sec",style:"width:100%;margin-top:12px",text:"خروج از حساب",onclick:logout}));
  }

  function field(id,label,type,ph){
    return [el("label",{for:id,text:label}),el("input",{id:id,type:type||"text",placeholder:ph||""})];
  }
  function v(id){return document.getElementById(id).value.trim()}
  function renderNew(){
    view.textContent="";
    var form=el("div",{class:"card"});
    [].concat(field("oc","شهر مبدا *"),field("oa","محله / آدرس مبدا"),field("dc","شهر مقصد *"),field("da","محله / آدرس مقصد"),
      field("ct","نوع بار *","text","مثلا اسباب‌کشی، مصالح"),field("wk","وزن تقریبی (کیلو)","number"),
      field("wh","زمان بارگیری","text","مثلا فردا ساعت ۹ صبح"),field("ph","شماره تماس *","tel","09...")
    ).forEach(function(n){form.appendChild(n)});
    var msg=el("div",{class:"meta",id:"msg"});
    var btn=el("button",{class:"btn",text:"ثبت آگهی",style:"width:100%;margin-top:14px",onclick:function(){
      var d={originCity:v("oc"),originAddress:v("oa"),destCity:v("dc"),destAddress:v("da"),cargoType:v("ct"),weightKg:v("wk"),when:v("wh"),phone:v("ph")};
      if(!d.originCity||!d.destCity||!d.cargoType||d.phone.length<10){msg.textContent="فیلدهای ستاره‌دار را کامل کنید.";return}
      btn.disabled=true;msg.textContent="در حال ثبت...";
      api("/loads",{method:"POST",body:d}).then(function(){setTab("mine")})
        .catch(function(e){msg.textContent=e.message;btn.disabled=false});
    }});
    form.appendChild(btn);form.appendChild(msg);view.appendChild(form);
  }

  /* ---------- tabs ---------- */
  function setTab(t){
    tab=t;
    document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
    if(t==="new"){setNote("");renderNew();return}
    setNote("در حال دریافت...");
    api(t==="mine"?"/loads/mine":"/loads").then(function(j){
      loads=j;setNote("");t==="mine"?renderMine():renderList();
    }).catch(function(e){if(e.message!=="auth")setNote(e.message)});
  }
  document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){setTab(b.dataset.t)})});

  function start(){
    setNote("");
    if(!token){renderLogin("phone");return}
    nav.style.display="flex";
    setTab("list");
  }
  start();
})();
</script>
</body>
</html>
